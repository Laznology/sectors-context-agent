services:
  postgres:
    image: postgres:17-alpine
    container_name: sectors-context-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sectors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sectors}
      POSTGRES_DB: ${POSTGRES_DB:-sectors}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sectors} -d ${POSTGRES_DB:-sectors}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
